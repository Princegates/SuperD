name: Validate Supabase migrations

# Catches the two ways a migration has actually broken this repo before:
# a filename collision between two branches that each picked the same
# "next" number (see scripts/check_migration_numbers.sh), and a migration
# that simply doesn't apply cleanly on top of every one before it. Runs
# on the PR's merge ref by default, so a collision with something already
# merged on the base branch surfaces here, not after merging.

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
  push:
    branches: [claude/delivery-management-app-dscw6o]
    paths:
      - "supabase/migrations/**"

jobs:
  check-migration-numbers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check_migration_numbers.sh

  apply-migrations:
    runs-on: ubuntu-latest
    needs: check-migration-numbers
    # The same Supabase-flavored Postgres image `supabase start` uses for
    # local dev (its own init scripts bootstrap the auth/storage schemas,
    # roles, and extensions every migration assumes) - started directly
    # as a service container rather than through `supabase start`/`supabase
    # db reset`, since the CLI's own migration runner tracks applied
    # migrations in supabase_migrations.schema_migrations keyed by the
    # version parsed from each filename, and fails outright on this
    # repo's one intentional exception (0002_roles_step1_enum.sql and
    # 0002_roles_step2_policies.sql deliberately share version "0002" -
    # see scripts/check_migration_numbers.sh - because Postgres won't let
    # a new enum value be used in the same transaction that created it).
    # Applying each file with plain psql, in order, has no such
    # uniqueness constraint - it's the same thing the README's manual SQL
    # Editor setup already does, just automated.
    #
    # Started with a plain `docker run` in its own step rather than
    # GitHub's `services:` block: the image's own init scripts print an
    # enormous amount of output while bootstrapping the auth/storage
    # schemas, roles, and extensions, and a `services:` container's
    # startup log is captured into its own separate "Initialize
    # containers" step - large enough in practice to push whatever ran
    # afterward out of reach when debugging a failure here. Starting it
    # by hand keeps that noise out of the way and, on a timeout, dumps
    # `docker logs` directly into this step's own output instead.
    steps:
      - uses: actions/checkout@v4
      # ubuntu-latest's preinstalled psql version isn't guaranteed to
      # match Postgres 17 - installing the matching client explicitly
      # avoids depending on whatever happens to already be on the image.
      - name: Install postgresql-client
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Start Postgres
        run: |
          set -euo pipefail
          docker run -d --name migration-check-pg \
            -e POSTGRES_PASSWORD=postgres \
            -e JWT_SECRET=super-secret-jwt-token-with-at-least-32-characters-long \
            -p 5432:5432 \
            ghcr.io/supabase/postgres:17.6.1.165 >/dev/null

          for i in $(seq 1 60); do
            if PGPASSWORD=postgres pg_isready -h 127.0.0.1 -p 5432 -U postgres >/dev/null 2>&1; then
              echo "Postgres is up after about $((i * 2))s."
              exit 0
            fi
            sleep 2
          done

          echo "Postgres never became reachable on 127.0.0.1:5432 - container logs:"
          docker logs migration-check-pg
          exit 1
      - name: Apply every migration in order
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          for f in supabase/migrations/*.sql; do
            echo "Applying $f"
            psql -h 127.0.0.1 -p 5432 -U postgres -d postgres -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Stop Postgres
        if: always()
        run: docker rm -f migration-check-pg || true
