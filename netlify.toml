[build]
  command = "rm -rf _flutter && git clone https://github.com/flutter/flutter.git -b stable --depth 1 _flutter && export PATH=\"$PATH:$PWD/_flutter/bin\" && flutter config --no-analytics && flutter build web --no-web-resources-cdn --dart-define=SUPABASE_URL=$SUPABASE_URL --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
  publish = "build/web"

[build.environment]
  # SUPABASE_URL/SUPABASE_ANON_KEY are meant to be public client-side
  # values (protected by RLS, not secrecy) - Flutter compiles them
  # straight into build/web's JS via --dart-define above, which is
  # expected and safe, but Netlify's secrets scanner otherwise flags
  # that as a leak and blocks the deploy. This tells the scanner these
  # two keys are intentionally public; it still flags anything else
  # (a service_role key, say) that shows up unexpectedly.
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL,SUPABASE_ANON_KEY"
  # `_flutter/` is the Flutter SDK the build command clones fresh each
  # run (Netlify's own image doesn't have Flutter installed) - it's
  # third-party vendored code, not ours, and its own binaries can
  # contain strings that look like API keys (e.g. a Google API key
  # pattern baked into dartdev_aot.dart.snapshot). Excluding this path
  # only skips scanning the vendored SDK; our own code and env vars are
  # still scanned normally.
  SECRETS_SCAN_OMIT_PATHS = "_flutter/**"
