<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="SuperDelivery is the delivery management platform for local businesses - connecting vendors, dispatchers, and riders from order to doorstep.">

  <!--
    Google Search Console site ownership verification - one tag per
    verified domain (superd.anknovate.com and superdeliverygh.com both
    serve this same build, so both need their own token here).
  -->
  <meta name="google-site-verification" content="-hWErv3qI42PfEODKKUSDS_ODizLVTSerbSaIcAH364" />
  <meta name="google-site-verification" content="Kh5o9Bjm3snQeFIKsbnEIe7x0gUPuPKKYzI4pOTvCvY" />

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="SuperD">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>SuperDelivery — Delivering More. Connecting Better.</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Google Maps JS API key for the web build's location picker/preview.
    Replace YOUR_GOOGLE_MAPS_API_KEY_HERE with your own key - see the
    README's "Google Maps setup" section. This key is expected to be
    visible in page source on web (that's how the Maps JS API always
    works); restrict it to your domain via HTTP referrer restrictions in
    Google Cloud Console rather than trying to hide it.
  -->
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCPaZRTWzAK1L3oQn7zAOYWkVc_qMyMSHs"></script>

  <!--
    Cloudflare Turnstile - see the README's "Public form protection"
    section. render=explicit: TurnstileWidget calls turnstile.render(...)
    itself with a direct element reference rather than relying on this
    script's automatic DOM scan (which can't find a div Flutter Web
    mounts inside a shadow root - see turnstile_widget_web.dart). Harmless
    to load even if TURNSTILE_SITE_KEY isn't set: TurnstileWidget renders
    nothing without one, so this script just sits idle.
  -->
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
